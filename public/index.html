<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Анонимный чат</title>
<style>
№list*{flex:none}#list{min-height:0}body{height:100dvh}
:root{--bg:#edeff4;--card:#fff;--ink:#1b1f2a;--muted:#6b7287;--accent:#4b3be0;--line:#d9dde7;--warn:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#14161d;--card:#1f232e;--ink:#eceef5;--muted:#99a0b5;--accent:#8b7dff;--line:#2f3445;--warn:#fb923c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{align-self:flex-start;max-width:min(520px,88%);background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px 0;overflow:hidden}
.m.me{align-self:flex-end;border-color:var(--accent);border-radius:14px 14px 4px 14px}
.m p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.m .gone{color:var(--muted);font-style:italic}
.m img,.m video{display:block;max-width:100%;max-height:360px;margin:0 0 6px;border-radius:8px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-bottom:7px;font-size:12px;color:var(--muted)}
.meta button{padding:0;border:0;background:none;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.meta .warn{color:var(--warn)}
.life{display:block;height:3px;margin:0 -12px;background:var(--accent);opacity:.65}
form{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
textarea{flex:1 1 200px;min-height:44px;max-height:140px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button.b{min-height:44px;padding:0 16px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
button.b.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#chip{flex-basis:100%;font-size:13px;color:var(--muted)}
#chip button{margin-left:8px;border:0;background:none;color:var(--warn);font:inherit;cursor:pointer}
#err{flex-basis:100%;margin:0;font-size:13px;color:var(--warn)}
footer{padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--card)}
footer button{padding:0;border:0;background:none;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Анонимный чат</h1>
  <p id="sub">Никто не видит, кто пишет.</p>
</header>
<main id="list" aria-live="polite"></main>
<form id="form">
  <textarea id="text" maxlength="2000" placeholder="Напиши сообщение" aria-label="Сообщение"></textarea>
  <button type="button" class="b alt" id="pick">Фото или видео</button>
  <button type="submit" class="b" id="send">Отправить</button>
  <input type="file" id="file" hidden accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime">
  <div id="chip" hidden><span></span><button type="button">убрать</button></div>
  <p id="err" role="alert"></p>
</form>
<footer>Сайт не хранит имена, аккаунты и IP-адреса. Из фото перед отправкой убираются геометки, из видео — нет. <button id="adm" type="button">админ</button></footer>

<script>
const $ = s => document.querySelector(s);
const h = (t, a = {}, ...k) => { const e = document.createElement(t); Object.assign(e, a); e.append(...k); return e; };
const KEY = decodeURIComponent(location.hash.slice(1));
let hours = 72, admin = sessionStorage.getItem('adm') || '', file = null;
let mine = new Map(); try { mine = new Map(JSON.parse(localStorage.getItem('mine') || '[]')); } catch {}
const els = new Map();

const hdr = () => { const o = {}; if (KEY) o['x-room'] = KEY; if (admin) o['x-admin'] = admin; return o; };
const span = (hrs) => hrs >= 48 ? Math.ceil(hrs / 24) + ' дн.' : Math.max(1, Math.ceil(hrs)) + ' ч';

function build(m) {
  const el = h('div', { className: 'm' + (mine.has(m.id) ? ' me' : '') });
  if (m.hidden && !admin) {
    el.append(h('p', { className: 'gone', textContent: 'Сообщение скрыто после жалоб' }));
  } else {
    if (m.hidden) el.append(h('p', { className: 'gone', textContent: 'Скрыто для всех после жалоб' }));
    if (m.text) el.append(h('p', { textContent: m.text }));
    if (m.file) el.append(m.kind === 'video'
      ? h('video', { src: '/uploads/' + m.file, controls: true, preload: 'metadata', playsInline: true })
      : h('img', { src: '/uploads/' + m.file, loading: 'lazy', alt: 'Фото из чата' }));
  }
  const total = hours * 3600e3, left = Math.max(0, m.t + total - Date.now());
  const meta = h('div', { className: 'meta' },
    h('span', { textContent: new Date(m.t).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) }),
    h('span', { textContent: 'ещё ' + span(left / 3600e3) }));
  if (admin && m.rep) meta.append(h('span', { className: 'warn', textContent: 'жалоб: ' + m.rep }));
  if (mine.has(m.id) || admin) meta.append(h('button', { textContent: 'удалить', onclick: () => del(m.id) }));
  else if (!m.hidden) { const b = h('button', { textContent: 'пожаловаться' }); b.onclick = () => report(m.id, b); meta.append(b); }
  const life = h('i', { className: 'life' }); life.style.width = Math.round(left / total * 100) + '%';
  el.append(meta, life);
  return el;
}

function render(items) {
  const list = $('#list'), stick = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  const ids = new Set(items.map(m => m.id));
  for (const [id, el] of els) if (!ids.has(id)) { el.remove(); els.delete(id); }
  for (const m of items) {
    const sig = [m.hidden, m.rep, !!admin, mine.has(m.id)].join();
    const old = els.get(m.id);
    if (old && old.dataset.sig === sig) continue;
    const el = build(m); el.dataset.sig = sig;
    old ? old.replaceWith(el) : list.append(el);
    els.set(m.id, el);
  }
  if (stick) list.scrollTop = list.scrollHeight;
}

async function load() {
  try {
    const r = await fetch('/api/messages', { headers: hdr() });
    if (r.status === 403) { $('#list').textContent = 'Нет доступа. Открой ссылку целиком, вместе с секретным словом после #.'; $('#form').hidden = true; return; }
    const d = await r.json();
    hours = d.hours;
    $('#sub').textContent = 'Никто не видит, кто пишет. Сообщения пропадают через ' + span(hours) + '.';
    if (admin && !d.admin) { admin = ''; sessionStorage.removeItem('adm'); alert('Неверный пароль админа'); }
    render(d.items);
  } catch {}
}

async function del(id) {
  if (!confirm('Удалить сообщение у всех?')) return;
  const o = hdr(), t = mine.get(id); if (t) o['x-token'] = t;
  await fetch('/api/messages/' + id, { method: 'DELETE', headers: o });
  load();
}
async function report(id, b) {
  await fetch('/api/messages/' + id + '/report', { method: 'POST', headers: hdr() });
  b.textContent = 'жалоба отправлена'; b.disabled = true;
}

// Перекодируем фото через canvas: так пропадают EXIF и геометки, и файл становится меньше
async function clean(f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return f;
  try {
    const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(bmp, 0, 0, c.width, c.height);
    return (await new Promise(r => c.toBlob(r, 'image/jpeg', .85))) || f;
  } catch { return f; }
}

function chip() { $('#chip').hidden = !file; $('#chip span').textContent = file ? file.name : ''; if (!file) $('#file').value = ''; }
$('#pick').onclick = () => $('#file').click();
$('#file').onchange = e => { file = e.target.files[0] || null; chip(); };
$('#chip button').onclick = () => { file = null; chip(); };

$('#form').onsubmit = async e => {
  e.preventDefault();
  const text = $('#text').value.trim();
  if (!text && !file) return;
  const btn = $('#send'); btn.disabled = true; $('#err').textContent = '';
  try {
    const fd = new FormData(); fd.append('text', text);
    if (file) { const b = await clean(file); fd.append('file', b, b === file ? file.name : 'photo.jpg'); }
    const r = await fetch('/api/messages', { method: 'POST', headers: hdr(), body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    mine.set(d.id, d.token);
    try { localStorage.setItem('mine', JSON.stringify([...mine])); } catch {}
    $('#text').value = ''; file = null; chip();
    await load();
    $('#list').scrollTop = $('#list').scrollHeight;
  } catch (err) { $('#err').textContent = err.message || 'Не получилось отправить'; }
  btn.disabled = false;
};

$('#adm').onclick = () => {
  const p = prompt('Пароль админа');
  if (p) { admin = p; sessionStorage.setItem('adm', p); load(); }
};

load();
setInterval(() => { if (!document.hidden) load(); }, 4000);
</script>
</body>
</html>
